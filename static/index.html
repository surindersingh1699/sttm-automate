<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STTM Automate</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <header>
        <h1>STTM Automate</h1>
        <div class="controls">
            <button id="btn-pause" class="btn btn-warning" onclick="togglePause()">Pause</button>
            <button class="btn btn-small" onclick="flushContext()" title="Drop the rolling audio window and hypothesis memory so matching restarts from what's being recited right now. Keeps the current shabad lock.">Clear Audio Cache</button>
            <button class="btn btn-danger" onclick="forceUnlock()">Force Unlock</button>
            <select id="audio-device" class="control-input" onchange="setAudioDevice(this.value)" title="Audio input device">
                <option value="auto">Auto (Default Mic)</option>
            </select>
            <select id="whisper-engine" class="control-input" onchange="setWhisperEngine(this.value)" title="Transcription backend">
                <option value="faster-whisper">faster-whisper (CT2 CPU)</option>
                <option value="mlx-whisper">mlx-whisper (Apple Silicon)</option>
                <option value="whisper-cpp">whisper.cpp (GGML)</option>
            </select>
            <span id="engine-status" class="pin-status"></span>
            <select id="audio-source" class="control-input" onchange="setAudioSource(this.value)" title="Local = server mic, Remote = your device mic">
                <option value="local" selected>Local Mic (Server)</option>
                <option value="remote">Remote Mic (This Device)</option>
            </select>
            <span id="mic-status" class="mic-status"></span>
            <select id="confidence-mode" class="control-input" onchange="setConfidenceMode(this.value)">
                <option value="conservative">Conservative</option>
                <option value="balanced" selected>Balanced</option>
                <option value="fast">Fast</option>
            </select>
            <label class="decoder-toggle" title="When on, search is restricted to Sri Guru Granth Sahib Ji only. Off = also matches Dasam Granth, Vaaran Bhai Gurdas, Bhai Nand Lal, Sarabloh, Rehitname, etc.">
                <input type="checkbox" id="sggs-only" onchange="setSggsOnly(this.checked)"> SGGS only
            </label>
            <button class="btn btn-small" id="btn-reconnect-sttm" onclick="reconnectSttm()" title="Re-probe STTM Desktop ports (use after starting or restarting STTM)">Reconnect STTM</button>
            <span id="sttm-status" class="pin-status"></span>
            <input id="controller-pin" class="control-input" type="number" inputmode="numeric" placeholder="Controller PIN">
            <button class="btn btn-small" onclick="setControllerPin()">Set PIN</button>
            <button class="btn btn-small" onclick="clearControllerPin()">Clear</button>
            <span id="pin-status" class="pin-status"></span>
            <span id="status-indicator" class="status-dot status-connecting"></span>
            <span id="status-text">Connecting...</span>
        </div>
    </header>

    <main>
        <!-- Live Transcription -->
        <section class="panel" id="panel-transcription">
            <h2>Live Transcription <span id="model-speed" class="model-speed" title="Model inference latency / real-time factor"></span></h2>
            <div class="panel-content">
                <div class="audio-bar"><div id="audio-level" class="audio-fill"></div></div>
                <div id="alap-detour" class="alap-detour" hidden>
                    <span class="alap-detour-badge">Alap detour</span>
                    <span id="alap-detour-text"></span>
                    <span id="alap-detour-meta" class="alap-detour-meta"></span>
                </div>
                <div id="transcription-text" class="scrollable">Waiting for audio...</div>
                <div id="first-letters" class="first-letters"></div>
            </div>
        </section>

        <!-- Candidate Matches -->
        <section class="panel" id="panel-candidates">
            <h2>Matched Shabads</h2>
            <div class="panel-content">
                <div id="candidates-list" class="scrollable">
                    <p class="placeholder">Listening for kirtan...</p>
                </div>
            </div>
        </section>

        <!-- Shabad Lines (Pangati) -->
        <section class="panel" id="panel-pangati">
            <h2>Shabad Lines</h2>
            <div class="panel-content">
                <div id="pangati-list" class="scrollable">
                    <p class="placeholder">Lock a shabad to see its lines</p>
                </div>
            </div>
        </section>

        <!-- Current Shabad -->
        <section class="panel" id="panel-current">
            <h2>Current Shabad</h2>
            <div class="panel-content">
                <div id="current-shabad" class="current-shabad">
                    <p class="placeholder">No shabad selected</p>
                </div>
                <div class="line-nav">
                    <button class="btn btn-small" onclick="navigateLine('prev')">&#9650; Prev Line</button>
                    <button class="btn btn-small" onclick="navigateLine('next')">&#9660; Next Line</button>
                </div>
            </div>
        </section>

        <!-- History Archive -->
        <section class="panel" id="panel-history">
            <h2>History</h2>
            <div class="panel-content">
                <div id="history-list" class="scrollable">
                    <p class="placeholder">No previous shabads</p>
                </div>
            </div>
        </section>
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
